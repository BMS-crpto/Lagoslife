<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Lagos Life Online</title>
<style>
  *{box-sizing:border-box;-webkit-user-select:none;user-select:none;touch-action:none}
  html,body{margin:0;height:100%;overflow:hidden;background:#87ceeb;font-family:system-ui,sans-serif;color:#fff}
  #menu{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;background:linear-gradient(#1e3c72,#2a5298);z-index:10;padding:20px;overflow:auto}
  #menu h1{margin:0;font-size:28px}
  input{padding:12px;border-radius:10px;border:0;font-size:16px;width:240px;text-align:center}
  .roles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;max-width:340px}
  .role{padding:10px 6px;border-radius:12px;background:#ffffff22;text-align:center;font-size:13px;border:2px solid transparent}
  .role b{display:block;font-size:26px}
  .role small{display:block;font-size:10px;opacity:.8}
  .role.sel{border-color:#ffd54a;background:#ffffff44}
  button{padding:14px 30px;font-size:18px;border:0;border-radius:12px;background:#ffd54a;font-weight:700}
  #hud{position:fixed;top:8px;left:8px;right:8px;display:flex;justify-content:space-between;gap:6px;pointer-events:none;font-size:13px;z-index:5}
  #hud div{background:#0008;padding:6px 10px;border-radius:10px}
  #money{color:#7CFC8A;font-weight:700}
  #toast{position:fixed;top:48px;left:50%;transform:translateX(-50%);background:#000a;padding:8px 14px;border-radius:10px;font-size:14px;opacity:0;transition:.3s;z-index:5;max-width:90%;text-align:center}
  #jailmsg{position:fixed;top:45%;left:50%;transform:translate(-50%,-50%);background:#000b;padding:14px 20px;border-radius:14px;font-size:20px;display:none;z-index:6;text-align:center}
  #stick{position:fixed;left:20px;bottom:30px;width:120px;height:120px;border-radius:50%;background:#ffffff33;z-index:5}
  #knob{position:absolute;left:35px;top:35px;width:50px;height:50px;border-radius:50%;background:#ffffffaa}
  #act{position:fixed;right:20px;bottom:40px;width:90px;height:90px;border-radius:50%;background:#e53935;font-size:14px;font-weight:700;border:0;color:#fff;z-index:5;padding:0}
  #use{position:fixed;right:20px;bottom:145px;min-width:90px;height:56px;border-radius:28px;background:#43a047;font-size:14px;font-weight:700;border:0;color:#fff;z-index:5;padding:0 14px;display:none}
  #chatbtn{position:fixed;right:20px;bottom:215px;width:50px;height:50px;border-radius:50%;background:#1e88e5;font-size:20px;padding:0;color:#fff;z-index:5}
  #chatlog{position:fixed;left:8px;top:90px;font-size:12px;max-width:60%;z-index:5;pointer-events:none}
  #chatlog div{background:#0007;padding:3px 8px;border-radius:8px;margin-bottom:3px}
</style>
</head>
<body>
<div id="menu">
  <h1>🇳🇬 Lagos Life Online</h1>
  <input id="name" placeholder="Your name" maxlength="14">
  <input id="room" placeholder="Room code (share with friends)" maxlength="8" style="text-transform:uppercase">
  <div>Choose your role</div>
  <div class="roles" id="roles"></div>
  <button id="play">PLAY</button>
</div>
<div id="hud"><div id="info"></div><div id="money">₦500</div><div id="players"></div></div>
<div id="toast"></div>
<div id="jailmsg">⛓️ You are in JAIL<br><small>Wait, or a lawyer can free you</small></div>
<div id="chatlog"></div>
<div id="food" style="display:none;position:fixed;left:50%;bottom:140px;transform:translateX(-50%);z-index:7;flex-direction:column;gap:6px;background:#000c;padding:10px;border-radius:14px"></div>
<div id="stick"><div id="knob"></div></div>
<button id="act">ACTION</button>
<button id="use"></button>
<button id="chatbtn">💬</button>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const ROLES = {
  police:{emoji:'🚔',label:'Police',color:0x1e40ff,hat:0x0b1a66,desc:'Arrest thieves'},
  thief:{emoji:'🦹',label:'Thief',color:0x222222,hat:0x000000,desc:'Rob shops'},
  nurse:{emoji:'💉',label:'Nurse',color:0x26c6da,hat:0xffffff,desc:'Heal people'},
  lawyer:{emoji:'⚖️',label:'Lawyer',color:0x6d4c41,hat:0x3e2723,desc:'Free from jail'},
  taxi:{emoji:'🚌',label:'Danfo',color:0xfdd835,hat:0xf9a825,desc:'Carry passengers'},
  courier:{emoji:'📦',label:'Dispatch',color:0xff7043,hat:0xbf360c,desc:'Deliver packages'}
};
let myRole='police';
const rolesEl=document.getElementById('roles');
Object.entries(ROLES).forEach(([k,r])=>{
  const d=document.createElement('div');d.className='role'+(k===myRole?' sel':'');
  d.innerHTML=`<b>${r.emoji}</b>${r.label}<small>${r.desc}</small>`;
  d.onclick=()=>{myRole=k;[...rolesEl.children].forEach(c=>c.classList.remove('sel'));d.classList.add('sel')};
  rolesEl.appendChild(d);
});

// ---------- three.js scene ----------
const scene=new THREE.Scene();
scene.background=new THREE.Color(0x87ceeb);
scene.fog=new THREE.Fog(0x87ceeb,40,120);
const camera=new THREE.PerspectiveCamera(60,innerWidth/innerHeight,0.1,200);
const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setSize(innerWidth,innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
document.body.appendChild(renderer.domElement);
addEventListener('resize',()=>{renderer.setSize(innerWidth,innerHeight);camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix()});
const hemi=new THREE.HemisphereLight(0xffffff,0x557755,0.9);scene.add(hemi);
const sun=new THREE.DirectionalLight(0xffffff,0.6);sun.position.set(30,50,20);scene.add(sun);

const mat=c=>new THREE.MeshLambertMaterial({color:c});
const ground=new THREE.Mesh(new THREE.PlaneGeometry(400,400),mat(0x4caf50));
ground.rotation.x=-Math.PI/2;scene.add(ground);

const ROAD=12, BLOCK=40;
for(let i=-5;i<=5;i++){
  const r1=new THREE.Mesh(new THREE.PlaneGeometry(400,ROAD),mat(0x333333));
  r1.rotation.x=-Math.PI/2;r1.position.set(0,0.02,i*BLOCK);scene.add(r1);
  const r2=new THREE.Mesh(new THREE.PlaneGeometry(ROAD,400),mat(0x333333));
  r2.rotation.x=-Math.PI/2;r2.position.set(i*BLOCK,0.02,0);scene.add(r2);
  const l1=new THREE.Mesh(new THREE.PlaneGeometry(400,0.3),mat(0xffc107));
  l1.rotation.x=-Math.PI/2;l1.position.set(0,0.04,i*BLOCK);scene.add(l1);
  const l2=new THREE.Mesh(new THREE.PlaneGeometry(0.3,400),mat(0xffc107));
  l2.rotation.x=-Math.PI/2;l2.position.set(i*BLOCK,0.04,0);scene.add(l2);
}
const solids=[];
let seed=7;function sr(){seed=(seed*16807)%2147483647;return seed/2147483647}
const bcolors=[0xb0bec5,0xd7a86e,0xa1887f,0x90a4ae,0xcfd8dc,0xe57373];
for(let bx=-4;bx<4;bx++)for(let bz=-4;bz<4;bz++){
  const cx=bx*BLOCK+BLOCK/2, cz=bz*BLOCK+BLOCK/2;
  const isDown=Math.abs(bx+0.5)<2&&Math.abs(bz+0.5)<2;
  const n=isDown?1:2;
  for(let k=0;k<n;k++){
    const w=isDown?18:10, d=isDown?18:10;
    const h=isDown?12+sr()*25:4+sr()*3;
    const ox=n===2?(k?9:-9):0, oz=n===2?(k?-6:6):0;
    const g=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat(bcolors[Math.floor(sr()*bcolors.length)]));
    g.position.set(cx+ox,h/2,cz+oz);scene.add(g);
    if(!isDown){
      const roof=new THREE.Mesh(new THREE.ConeGeometry(w*0.75,3,4),mat(0x8d3b2e));
      roof.position.set(cx+ox,h+1.5,cz+oz);roof.rotation.y=Math.PI/4;scene.add(roof);
    }
    solids.push({x:cx+ox,z:cz+oz,hw:w/2+0.6,hd:d/2+0.6});
  }
  // trees stay out of the marker spots
  const tx=cx+(sr()-0.5)*8, tz=cz+(sr()-0.5)*8;
  const t=new THREE.Mesh(new THREE.ConeGeometry(1.6,5,6),mat(0x2e7d32));
  t.position.set(tx,2.5,tz);scene.add(t);
}

// ---------- cars ----------
const carCols=[0xe53935,0x1e88e5,0xfdd835,0xffffff,0x8e24aa];
function makeCar(col){
  const c=new THREE.Group();
  const body=new THREE.Mesh(new THREE.BoxGeometry(2,0.8,4.2),mat(carCols[col]));body.position.y=0.7;c.add(body);
  const top=new THREE.Mesh(new THREE.BoxGeometry(1.8,0.7,2.2),mat(0x263238));top.position.y=1.4;c.add(top);
  [[-1,1.4],[1,1.4],[-1,-1.4],[1,-1.4]].forEach(([x,z])=>{
    const w=new THREE.Mesh(new THREE.CylinderGeometry(0.45,0.45,0.35,10),mat(0x111111));
    w.rotation.z=Math.PI/2;w.position.set(x,0.45,z);c.add(w);
  });
  return c;
}
const parked=[];
for(let i=0;i<14;i++){
  const col=i%5, g=makeCar(col);
  const x=((i*37)%9-4)*BLOCK+4, z=((i*53)%9-4)*BLOCK+(i%2?3:-3), ry=i%2?Math.PI/2:0;
  g.position.set(x,0,z);g.rotation.y=ry;scene.add(g);
  parked.push({g,x,z,ry,col});
}

// ---------- labels & characters ----------
function makeLabel(text,color,y,sx){
  const cv=document.createElement('canvas');cv.width=320;cv.height=64;
  const g=cv.getContext('2d');g.font='bold 28px sans-serif';g.textAlign='center';
  g.fillStyle='#0009';g.fillRect(0,8,320,48);g.fillStyle=color||'#fff';g.fillText(text,160,43);
  const s=new THREE.Sprite(new THREE.SpriteMaterial({map:new THREE.CanvasTexture(cv),depthTest:false}));
  s.scale.set(sx||4,0.8,1);s.position.y=y||3.1;return s;
}
function makeCharacter(role,name){
  const r=ROLES[role];const g=new THREE.Group();const body=new THREE.Group();
  const skin=mat(0xf1c27d);
  const legL=new THREE.Mesh(new THREE.BoxGeometry(0.4,0.9,0.4),mat(0x37474f));legL.position.set(-0.22,0.45,0);
  const legR=legL.clone();legR.position.x=0.22;
  const torso=new THREE.Mesh(new THREE.BoxGeometry(1,1.1,0.55),mat(r.color));torso.position.y=1.45;
  const head=new THREE.Mesh(new THREE.BoxGeometry(0.6,0.6,0.6),skin);head.position.y=2.25;
  const hat=new THREE.Mesh(new THREE.BoxGeometry(0.7,0.2,0.7),mat(r.hat));hat.position.y=2.65;
  const armL=new THREE.Mesh(new THREE.BoxGeometry(0.3,1,0.3),mat(r.color));armL.position.set(-0.65,1.45,0);
  const armR=armL.clone();armR.position.x=0.65;
  body.add(legL,legR,torso,head,hat,armL,armR);g.add(body);
  g.add(makeLabel(`${r.emoji} ${name}`,'#fff'));
  g.userData={body,legL,legR,armL,armR,t:0,carG:null,curCar:-1};
  return g;
}
function setCarMode(g,col){
  const u=g.userData;
  if(col>=0){
    u.body.visible=false;
    if(u.curCar!==col){if(u.carG)g.remove(u.carG);u.carG=makeCar(col);g.add(u.carG);u.curCar=col}
    u.carG.visible=true;
  }else{u.body.visible=true;if(u.carG)u.carG.visible=false;u.curCar=-1;if(u.carG){g.remove(u.carG);u.carG=null}}
}

// ---------- world objects from server ----------
let world=null;const houseObjs={};
function buildWorld(w){
  world=w;
  w.houses.forEach(h=>{
    const g=new THREE.Group();
    const b=new THREE.Mesh(new THREE.BoxGeometry(8,5,8),mat(0xfff3c4));b.position.y=2.5;g.add(b);
    const rf=new THREE.Mesh(new THREE.ConeGeometry(6.5,3,4),mat(0x2e7d32));rf.position.y=6.5;rf.rotation.y=Math.PI/4;g.add(rf);
    const door=new THREE.Mesh(new THREE.BoxGeometry(1.6,3,0.2),mat(0x5d4037));door.position.set(0,1.5,4.05);g.add(door);
    g.position.set(h.x,0,h.z);scene.add(g);
    solids.push({x:h.x,z:h.z,hw:4.6,hd:4.6});
    const lab=makeLabel(`🏠 ₦${h.price}`,'#7CFC8A',9.5,4.2);g.add(lab);
    houseObjs[h.id]={g,lab,owner:null,price:h.price};
  });
  w.shops.forEach(s=>{
    const g=new THREE.Group();
    const b=new THREE.Mesh(new THREE.BoxGeometry(7,4.5,7),mat(0xffa000));b.position.y=2.25;g.add(b);
    const aw=new THREE.Mesh(new THREE.BoxGeometry(7.6,0.4,2.5),mat(0xd32f2f));aw.position.set(0,3.6,4);g.add(aw);
    g.position.set(s.x,0,s.z);scene.add(g);
    solids.push({x:s.x,z:s.z,hw:4.1,hd:4.1});
    g.add(makeLabel('🍲 Mama Put',"#ffd54a",7,3.2));
  });
  if(w.club){const c=new THREE.Group();
    const b=new THREE.Mesh(new THREE.BoxGeometry(14,8,12),mat(0x6a1b9a));b.position.y=4;c.add(b);
    const sg=new THREE.Mesh(new THREE.BoxGeometry(10,1.4,0.3),mat(0xff4081));sg.position.set(0,6.5,6.2);c.add(sg);
    c.position.set(w.club.x,0,w.club.z);scene.add(c);solids.push({x:w.club.x,z:w.club.z,hw:7.6,hd:6.6});
    c.add(makeLabel('🎉 Quilox Club','#ff80ab',10.5,4.4));}
  const j=new THREE.Mesh(new THREE.BoxGeometry(14,0.1,14),mat(0x555555));j.position.set(w.jail.x,0.06,w.jail.z);scene.add(j);
  for(const [dx,dz] of [[-7,-7],[7,-7],[-7,7],[7,7]]){
    const p=new THREE.Mesh(new THREE.BoxGeometry(0.6,5,0.6),mat(0x222222));p.position.set(w.jail.x+dx,2.5,w.jail.z+dz);scene.add(p);
  }
  const jl=makeLabel('⛓️ JAIL','#ff8a80',7,3.2);jl.position.x=w.jail.x;jl.position.z=w.jail.z;scene.add(jl);
}
function updateOwners(owners){
  for(const id in houseObjs){
    const o=owners[id]||null,h=houseObjs[id];
    if(h.owner!==o){
      h.owner=o;h.g.remove(h.lab);
      h.lab=o?makeLabel(`🏠 ${o}`,'#ffd54a',9.5,4.2):makeLabel(`🏠 ₦${h.price}`,'#7CFC8A',9.5,4.2);
      h.g.add(h.lab);
    }
  }
}

// ---------- state ----------
const others={};let myId=null,ws=null,me=null,myMoney=500,jailed=false;
const pos={x:0,z:0,ry:0};
let joy={x:0,y:0};let camYaw=0;
let myCol=-1,carObj=null,speed=0,myEnergy=100,lastNepa=false;

const stick=document.getElementById('stick'),knob=document.getElementById('knob');
let stickId=null;
function setStick(t){
  const r=stick.getBoundingClientRect();
  let dx=t.clientX-(r.left+60),dy=t.clientY-(r.top+60);
  const m=Math.min(50,Math.hypot(dx,dy));const a=Math.atan2(dy,dx);
  dx=Math.cos(a)*m;dy=Math.sin(a)*m;
  knob.style.left=(35+dx)+'px';knob.style.top=(35+dy)+'px';
  joy.x=dx/50;joy.y=dy/50;
}
stick.addEventListener('touchstart',e=>{stickId=e.changedTouches[0].identifier;setStick(e.changedTouches[0])});
stick.addEventListener('touchmove',e=>{for(const t of e.changedTouches)if(t.identifier===stickId)setStick(t)});
const endStick=()=>{stickId=null;joy.x=joy.y=0;knob.style.left='35px';knob.style.top='35px'};
stick.addEventListener('touchend',endStick);stick.addEventListener('touchcancel',endStick);
let camTouch=null,lastX=0;
renderer.domElement.addEventListener('touchstart',e=>{camTouch=e.changedTouches[0].identifier;lastX=e.changedTouches[0].clientX});
renderer.domElement.addEventListener('touchmove',e=>{if(myCol>=0)return;for(const t of e.changedTouches)if(t.identifier===camTouch){camYaw-=(t.clientX-lastX)*0.01;lastX=t.clientX}});
const keys={};addEventListener('keydown',e=>keys[e.key.toLowerCase()]=1);addEventListener('keyup',e=>keys[e.key.toLowerCase()]=0);

function toast(t){const el=document.getElementById('toast');el.textContent=t;el.style.opacity=1;clearTimeout(toast.t);toast.t=setTimeout(()=>el.style.opacity=0,2800)}
function chatLine(n,t){const l=document.getElementById('chatlog');const d=document.createElement('div');d.textContent=`${n}: ${t}`;l.appendChild(d);setTimeout(()=>d.remove(),8000)}

document.getElementById('play').onclick=()=>{
  const name=document.getElementById('name').value.trim()||'Player'+Math.floor(Math.random()*99);
  const room=(document.getElementById('room').value.trim()||'CITY1').toUpperCase();
  document.getElementById('menu').style.display='none';
  const proto=location.protocol==='https:'?'wss':'ws';
  ws=new WebSocket(`${proto}://${location.host}`);
  ws.onopen=()=>ws.send(JSON.stringify({t:'join',name,room,role:myRole}));
  ws.onmessage=ev=>{
    const m=JSON.parse(ev.data);
    if(m.t==='welcome'){myId=m.id;buildWorld(m.world);document.getElementById('info').textContent=`Room ${m.room} • ${ROLES[myRole].emoji} ${ROLES[myRole].label}`}
    else if(m.t==='toast')toast(m.text);
    else if(m.t==='chat')chatLine(m.name,m.text);
    else if(m.t==='tp'){
      pos.x=m.x;pos.z=m.z;speed=0;
      if(myCol>=0&&carObj){ // leave car where it was
        carObj=null;myCol=-1;if(me)setCarMode(me,-1);
      }
    }
    else if(m.t==='state'){
      const seen={};
      m.players.forEach(p=>{
        seen[p.id]=1;
        if(p.id===myId){
          if(!me){me=makeCharacter(p.role,p.name+' (you)');scene.add(me);pos.x=p.x;pos.z=p.z}
          myMoney=p.money;jailed=p.jailed;
          myEnergy=p.energy;document.getElementById('money').textContent='₦'+p.money+'  ⚡'+p.energy+'  🎉'+p.vibes+(p.carry?' 📦':'');
          document.getElementById('jailmsg').style.display=p.jailed?'block':'none';
          return;
        }
        let o=others[p.id];
        if(!o){o={g:makeCharacter(p.role,p.name),tx:p.x,tz:p.z,try:0,moving:false};o.g.position.set(p.x,0,p.z);scene.add(o.g);others[p.id]=o}
        o.tx=p.x;o.tz=p.z;o.try=p.ry;o.moving=p.moving;
        if(o.g.userData.curCar!==p.car)setCarMode(o.g,p.car);
      });
      for(const id in others)if(!seen[id]){scene.remove(others[id].g);delete others[id]}
      updateOwners(m.owners||{});applyEnv(m.tod||0,m.rain,m.nepa);if(!!m.nepa!==lastNepa){lastNepa=!!m.nepa;toast(m.nepa?'💡 NEPA take light! Thieves go dey bold...':'💡 Light don come back!')}
      document.getElementById('players').textContent='👥 '+m.players.length;
    }
  };
  ws.onclose=()=>toast('Disconnected');
  setInterval(()=>{if(ws.readyState===1&&me)ws.send(JSON.stringify({t:'move',x:pos.x,z:pos.z,ry:pos.ry,moving:moving,car:myCol}))},66);
};
document.getElementById('act').onclick=()=>{ws&&ws.send(JSON.stringify({t:'action'}))};
document.getElementById('chatbtn').onclick=()=>{const t=prompt('Say something:');if(t&&ws)ws.send(JSON.stringify({t:'chat',text:t}))};

// USE button: enter/exit car, buy house
const useBtn=document.getElementById('use');
let useTarget=null;
useBtn.onclick=()=>{
  if(!useTarget||jailed)return;
  if(useTarget.type==='exit'){
    const pc=carObj;pc.x=pos.x;pc.z=pos.z;pc.ry=pos.ry;pc.g.position.set(pc.x,0,pc.z);pc.g.rotation.y=pc.ry;scene.add(pc.g);
    carObj=null;myCol=-1;speed=0;setCarMode(me,-1);
    const sx=pos.x+Math.cos(pos.ry)*3,sz=pos.z-Math.sin(pos.ry)*3;if(!collide(sx,sz)){pos.x=sx;pos.z=sz}
  }else if(useTarget.type==='enter'){
    const pc=useTarget.car;scene.remove(pc.g);carObj=pc;myCol=pc.col;speed=0;
    pos.x=pc.x;pos.z=pc.z;pos.ry=pc.ry;camYaw=pc.ry;setCarMode(me,myCol);
  }else if(useTarget.type==='buy'){
    ws.send(JSON.stringify({t:'buy'}));
  }else if(useTarget.type==='eat'){
    showFood();
  }else if(useTarget.type==='party'){
    ws.send(JSON.stringify({t:'party'}));
  }
};

const FOODMENU=['🍛 Jollof & chicken ₦50','🍲 Amala & ewedu ₦30','🍢 Suya ₦20'];
function showFood(){const f=document.getElementById('food');f.innerHTML='';f.style.display='flex';
  FOODMENU.forEach((n,i)=>{const b=document.createElement('button');b.textContent=n;b.style.cssText='font-size:15px;padding:10px 16px';b.onclick=()=>{ws.send(JSON.stringify({t:'eat',i}));f.style.display='none'};f.appendChild(b)});
  const c=document.createElement('button');c.textContent='Cancel';c.style.cssText='font-size:14px;padding:8px;background:#999';c.onclick=()=>{f.style.display='none'};f.appendChild(c)}
let moving=false;
function collide(nx,nz){
  for(const s of solids)if(Math.abs(nx-s.x)<s.hw&&Math.abs(nz-s.z)<s.hd)return true;
  return Math.abs(nx)>190||Math.abs(nz)>190;
}
function updateUse(){
  let t=null,label='';
  if(myCol>=0){t={type:'exit'};label='EXIT CAR'}
  else{
    let bd=5,bc=null;
    for(const pc of parked){const d=Math.hypot(pc.x-pos.x,pc.z-pos.z);if(d<bd){bd=d;bc=pc}}
    if(bc){t={type:'enter',car:bc};label='🚗 DRIVE'}
    else if(world){
      for(const h of world.houses){
        if(Math.hypot(h.x-pos.x,h.z-pos.z)<9&&!houseObjs[h.id].owner){t={type:'buy'};label=`🏠 BUY ₦${h.price}`;break}
      }
    }
  }
  if(!t&&world&&myCol<0)for(const s of world.shops)if(Math.hypot(s.x-pos.x,s.z-pos.z)<8){t={type:'eat'};label='🍲 EAT FOOD';break}
  if(!t&&world&&world.club&&myCol<0&&Math.hypot(world.club.x-pos.x,world.club.z-pos.z)<12){t={type:'party'};label='🎉 PARTY ₦100'}
  useTarget=jailed?null:t;
  if(useTarget){useBtn.style.display='block';if(useBtn.textContent!==label)useBtn.textContent=label}
  else useBtn.style.display='none';
}
// ---------- day/night + rain ----------
const dayCol=new THREE.Color(0x87ceeb),nightCol=new THREE.Color(0x0b1026),greyCol=new THREE.Color(0x6b7380);
const rainGeo=new THREE.BufferGeometry(),rp=new Float32Array(600*3);
for(let i=0;i<600;i++){rp[i*3]=(Math.random()-0.5)*40;rp[i*3+1]=Math.random()*30;rp[i*3+2]=(Math.random()-0.5)*40}
rainGeo.setAttribute('position',new THREE.BufferAttribute(rp,3));
const rainPts=new THREE.Points(rainGeo,new THREE.PointsMaterial({color:0xaaccff,size:0.25}));
rainPts.visible=false;rainPts.frustumCulled=false;scene.add(rainPts);let rainOn=false;
function applyEnv(tod,rain,nepa){
  let d=Math.max(0,Math.min(1,0.5+0.7*Math.sin(tod*Math.PI*2)));if(nepa)d*=0.35;
  const c=nightCol.clone().lerp(dayCol,d);if(rain)c.lerp(greyCol,0.6);
  scene.background=c;scene.fog.color.copy(c);scene.fog.near=rain?15:40;scene.fog.far=rain?70:120;
  hemi.intensity=0.3+0.6*d*(rain?0.8:1);sun.intensity=0.6*d;
  rainOn=!!rain;rainPts.visible=rainOn;
}
function updateRain(dt){
  if(!rainOn)return;
  const a=rainGeo.attributes.position;
  for(let i=0;i<600;i++){let y=a.getY(i)-35*dt;if(y<0)y=30;a.setY(i,y)}
  a.needsUpdate=true;rainPts.position.set(camera.position.x,0,camera.position.z);
}
let last=performance.now(),uc=0;
function wrap(a){return ((a+Math.PI*3)%(Math.PI*2))-Math.PI}
function loop(now){
  requestAnimationFrame(loop);
  const dt=Math.min(0.05,(now-last)/1000);last=now;
  let ix=joy.x,iy=joy.y;
  if(keys.a||keys.arrowleft)ix-=1;if(keys.d||keys.arrowright)ix+=1;
  if(keys.w||keys.arrowup)iy-=1;if(keys.s||keys.arrowdown)iy+=1;
  const mag=Math.min(1,Math.hypot(ix,iy));
  moving=false;
  if(me){
    if(!jailed){
      if(myCol>=0){
        // ---- driving: up = gas, down = brake/reverse, left/right = steer
        const thr=-iy;
        if(thr>0.1)speed+=thr*22*dt;else if(thr<-0.1)speed+=thr*26*dt;else speed*=(1-1.6*dt);
        speed=Math.max(-8,Math.min(28,speed));
        pos.ry-=ix*1.9*dt*Math.min(1,Math.abs(speed)/6)*(speed>=0?1:-1);
        const nx=pos.x+Math.sin(pos.ry)*speed*dt,nz=pos.z+Math.cos(pos.ry)*speed*dt;
        if(!collide(nx,nz)){pos.x=nx;pos.z=nz}
        else if(!collide(nx,pos.z))pos.x=nx;
        else if(!collide(pos.x,nz))pos.z=nz;
        else speed*=-0.3;
        moving=Math.abs(speed)>0.5;
        camYaw+=wrap(pos.ry-camYaw)*0.08;
      }else if(mag>0.15){
        const vx=-iy*Math.sin(camYaw)-ix*Math.cos(camYaw);
        const vz=-iy*Math.cos(camYaw)+ix*Math.sin(camYaw);
        const sp=9*mag*dt*(myEnergy<=0?0.5:1);
        const nx=pos.x+vx*sp,nz=pos.z+vz*sp;
        if(!collide(nx,pos.z))pos.x=nx;
        if(!collide(pos.x,nz))pos.z=nz;
        pos.ry=Math.atan2(vx,vz);moving=true;
      }
    }
    me.position.set(pos.x,0,pos.z);
    me.rotation.y=myCol>=0?pos.ry:me.rotation.y+wrap(pos.ry-me.rotation.y)*0.2;
    animate(me,moving&&myCol<0,dt);
    const cd=myCol>=0?13:11,ch=myCol>=0?6:7;
    camera.position.set(pos.x-Math.sin(camYaw)*cd,ch,pos.z-Math.cos(camYaw)*cd);
    camera.lookAt(pos.x,2,pos.z);
    if(++uc%6===0)updateUse();
  }else{camera.position.set(0,40,60);camera.lookAt(0,0,0)}
  for(const id in others){
    const o=others[id];
    o.g.position.x+=(o.tx-o.g.position.x)*0.25;
    o.g.position.z+=(o.tz-o.g.position.z)*0.25;
    o.g.rotation.y+=wrap(o.try-o.g.rotation.y)*0.2;
    animate(o.g,o.moving&&o.g.userData.curCar<0,dt);
  }
  updateRain(dt);
  renderer.render(scene,camera);
}
function animate(g,mv,dt){
  const u=g.userData;
  if(mv){u.t+=dt*10;const s=Math.sin(u.t)*0.7;u.legL.rotation.x=s;u.legR.rotation.x=-s;u.armL.rotation.x=-s;u.armR.rotation.x=s}
  else{u.legL.rotation.x*=0.8;u.legR.rotation.x*=0.8;u.armL.rotation.x*=0.8;u.armR.rotation.x*=0.8}
}
requestAnimationFrame(loop);
</script>
